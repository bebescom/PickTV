name: Build PickTV APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check project structure
        run: |
          echo "Current directory:"
          pwd

          echo "Root directory files:"
          ls -la

          echo "Gradle directory files:"
          find gradle -maxdepth 3 -type f -print 2>/dev/null || true

      - name: Repair Gradle Wrapper configuration
        shell: bash
        run: |
          set -e

          mkdir -p gradle/wrapper

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.4.1-bin.zip
          networkTimeout=60000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          echo "Gradle Wrapper configuration:"
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Show Gradle information
        run: ./gradlew --version --no-daemon

      - name: Build all Debug APKs
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            --warning-mode all

      - name: List generated APKs
        if: always()
        run: |
          echo "Generated APK files:"
          find . \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            -print || true

      - name: Upload APK files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PickTV-debug-apks
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PickTV-build-error-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: ignore
          retention-days: 7
