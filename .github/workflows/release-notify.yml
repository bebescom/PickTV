name: Build PickTV APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check project structure
        shell: bash
        run: |
          set -e

          echo "Current directory:"
          pwd

          echo ""
          echo "Root directory files:"
          ls -la

          echo ""
          echo "Gradle directory files:"
          find gradle -maxdepth 3 -type f -print 2>/dev/null || true

          echo ""
          echo "Android SDK path:"
          echo "$ANDROID_SDK_ROOT"

      - name: Create local.properties
        shell: bash
        run: |
          set -e

          if [ -z "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_SDK_ROOT is empty."
            exit 1
          fi

          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "sdkPath=$ANDROID_SDK_ROOT"
          } > local.properties

          echo "Created local.properties:"
          cat local.properties

      - name: Repair Gradle Wrapper configuration
        shell: bash
        run: |
          set -e

          mkdir -p gradle/wrapper

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.4.1-bin.zip
          networkTimeout=60000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          echo "Gradle Wrapper configuration:"
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Show Gradle information
        run: ./gradlew --version --no-daemon

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build all Debug APKs
        shell: bash
        run: |
          set -o pipefail

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            --warning-mode all \
            2>&1 | tee gradle-build.log

      - name: List generated APKs
        if: always()
        shell: bash
        run: |
          echo "Generated APK files:"

          find . \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            -print || true

      - name: Upload APK files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PickTV-debug-apks
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PickTV-build-error-reports
          path: |
            gradle-build.log
            local.properties
            gradle/wrapper/gradle-wrapper.properties
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
