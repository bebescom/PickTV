name: Build PickTV APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Repair Gradle Wrapper
        shell: bash
        run: |
          set -e

          mkdir -p gradle/wrapper

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.4.1-bin.zip
          networkTimeout=60000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          chmod +x gradlew

          echo "===== gradle-wrapper.properties ====="
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Generate build keystore
        shell: bash
        run: |
          set -e

          rm -f build-key.jks

          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/build-key.jks" \
            -storepass "android" \
            -keypass "android" \
            -alias "androiddebugkey" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=PickTV, OU=Build, O=PickTV, L=Chongqing, ST=Chongqing, C=CN"

          test -f "$GITHUB_WORKSPACE/build-key.jks"

          echo "Temporary keystore created."

      - name: Create local.properties
        shell: bash
        run: |
          set -e

          if [ -z "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_SDK_ROOT is empty."
            exit 1
          fi

          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          sdkPath=$ANDROID_SDK_ROOT
          storeFile=$GITHUB_WORKSPACE/build-key.jks
          keyAlias=androiddebugkey
          keyPassword=android
          storePassword=android
          key=androiddebugkey
          password=android
          EOF

          echo "===== local.properties keys ====="
          sed 's/=.*/=***/' local.properties

          echo ""
          echo "===== Keystore file ====="
          ls -lh "$GITHUB_WORKSPACE/build-key.jks"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Show relevant Gradle configuration
        shell: bash
        run: |
          echo "===== app/build.gradle lines 1-100 ====="
          nl -ba app/build.gradle | sed -n '1,100p'

          echo ""
          echo "===== Project files ====="
          find . -maxdepth 3 -type f \
            \( -name "*.gradle" -o -name "*.toml" -o -name "*.properties" \) \
            -print | sort

      - name: Show Gradle information
        shell: bash
        run: |
          ./gradlew --version --no-daemon

      - name: Build all Debug APKs
        shell: bash
        run: |
          set -o pipefail

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            --warning-mode all \
            2>&1 | tee gradle-build.log

      - name: List generated APKs
        if: always()
        shell: bash
        run: |
          echo "===== Generated APK files ====="

          find . \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            -print \
            -exec ls -lh {} \; || true

      - name: Upload APK files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PickTV-debug-apks
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete diagnostic files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PickTV-build-error-reports
          path: |
            gradle-build.log
            app/build.gradle
            build.gradle
            settings.gradle
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
