name: Diagnose PickTV Dependencies

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose Missing Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create dependency report
        shell: bash
        run: |
          set -e

          REPORT="dependency-report.txt"

          {
            echo "============================================================"
            echo "PickTV dependency diagnostic report"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "============================================================"
            echo ""

            echo "===== 1. Root directory ====="
            ls -la
            echo ""

            echo "===== 2. settings.gradle ====="
            if [ -f settings.gradle ]; then
              nl -ba settings.gradle
            else
              echo "settings.gradle does not exist"
            fi
            echo ""

            echo "===== 3. Root build.gradle ====="
            if [ -f build.gradle ]; then
              nl -ba build.gradle
            else
              echo "build.gradle does not exist"
            fi
            echo ""

            echo "===== 4. app/build.gradle ====="
            if [ -f app/build.gradle ]; then
              nl -ba app/build.gradle
            else
              echo "app/build.gradle does not exist"
            fi
            echo ""

            echo "===== 5. gradle/libs.versions.toml ====="
            if [ -f gradle/libs.versions.toml ]; then
              nl -ba gradle/libs.versions.toml
            else
              echo "gradle/libs.versions.toml does not exist"
            fi
            echo ""

            echo "===== 6. Hook directory structure ====="
            if [ -d hook ]; then
              find hook -type f -print | sort
            else
              echo "hook directory does not exist"
            fi
            echo ""

            echo "===== 7. Hook Java and Kotlin declarations ====="
            if [ -d hook ]; then
              grep -RIn \
                --include="*.java" \
                --include="*.kt" \
                -E "package com\.fongmi\.hook|class Hook|interface Hook|object Hook" \
                hook 2>/dev/null || true
            fi
            echo ""

            echo "===== 8. Media3 dependency declarations ====="
            grep -RIn \
              --include="*.gradle" \
              --include="*.gradle.kts" \
              --include="*.toml" \
              --include="*.properties" \
              -E "media3|exoplayer|danmaku|project.*hook|libs\.hook|com\.fongmi\.hook" \
              . \
              --exclude-dir=".git" \
              --exclude-dir="build" \
              2>/dev/null || true
            echo ""

            echo "===== 9. Local AAR and JAR files ====="
            find . \
              -type f \
              \( -name "*.aar" -o -name "*.jar" \) \
              -not -path "*/build/*" \
              -not -path "*/.git/*" \
              -print \
              -exec ls -lh {} \; \
              2>/dev/null | sort || true
            echo ""

            echo "===== 10. Git submodule configuration ====="
            if [ -f .gitmodules ]; then
              cat .gitmodules
            else
              echo ".gitmodules does not exist"
            fi
            echo ""

            echo "===== 11. Empty directories ====="
            find . \
              -type d \
              -empty \
              -not -path "*/.git/*" \
              -print \
              2>/dev/null | sort || true
            echo ""

            echo "===== 12. Media3 imports in source ====="
            grep -RIn \
              --include="*.java" \
              --include="*.kt" \
              -E "import androidx\.media3|import com\.fongmi\.hook" \
              app \
              2>/dev/null || true
            echo ""

            echo "===== 13. Git ignored files ====="
            if [ -f .gitignore ]; then
              cat .gitignore
            else
              echo ".gitignore does not exist"
            fi

          } > "$REPORT"

          cat "$REPORT"

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: PickTV-dependency-report
          path: dependency-report.txt
          if-no-files-found: error
          retention-days: 7
